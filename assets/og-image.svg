<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- 顶部细线 -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 左侧品牌块 -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
    <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">阁</text>
    <rect x="14" y="52" width="36" height="3" rx="1.5" fill="#2563eb"/>
  </g>

  <!-- 品牌名 -->
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="900" fill="#0a0a0c">阁主</text>
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="400" fill="#6b7280">电商 ERP · AI 系统作品集</text>

  <!-- 蓝色横条 -->
  <rect x="80" y="330" width="100" height="5" rx="2.5" fill="#2563eb"/>

  <!-- 副标题 -->
  <text x="80" y="400" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="500" fill="#374151">15+ 独立交付系统 · 6 大业务域 · 生产环境运行</text>

  <!-- 关键能力 -->
  <g transform="translate(80, 460)">
    <rect width="220" height="100" rx="12" fill="#f8f9fa" stroke="#e5e7eb"/>
    <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="600" fill="#2563eb">全栈独立开发</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#0a0a0c">15+ 系统</text>
  </g>
  <g transform="translate(320, 460)">
    <rect width="220" height="100" rx="12" fill="#f8f9fa" stroke="#e5e7eb"/>
    <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="600" fill="#2563eb">多 Agent 调度</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#0a0a0c">OpenClaw</text>
  </g>
  <g transform="translate(560, 460)">
    <rect width="220" height="100" rx="12" fill="#f8f9fa" stroke="#e5e7eb"/>
    <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="600" fill="#2563eb">业务提效</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#0a0a0c">300%+</text>
  </g>

  <!-- 底部信息 -->
  <text x="80" y="600" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="500" fill="#9ca3af">MINGYU · PORTFOLIO</text>
  <text x="1120" y="600" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="500" fill="#9ca3af" text-anchor="end">2026</text>
